<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Franklinford Field Collection</title>
<link rel="stylesheet" href="https://js.arcgis.com/4.34/esri/themes/dark/main.css">
<script src="https://js.arcgis.com/4.34/"></script>
<style>
html,body,#viewDiv{margin:0;padding:0;height:100%;width:100%}body{font-family:sans-serif}#panel{position:absolute;left:0;right:0;bottom:0;background:#10202b;color:#fff;padding:16px;z-index:10;border-radius:20px 20px 0 0}button{width:100%;padding:12px;margin-top:8px;border:none;border-radius:8px;font-weight:bold}#directions{background:#4de1d2}#survey{background:#ffc857}
</style>
<script>
require(["esri/Map","esri/views/MapView","esri/layers/FeatureLayer"],function(Map,MapView,FeatureLayer){
const layer=new FeatureLayer({url:"https://services1.arcgis.com/vHnIGBHHqDR6y0CR/arcgis/rest/services/FF_parcelpoints/FeatureServer/0",outFields:["*"]});
const map=new Map({basemap:"satellite",layers:[layer]});
const view=new MapView({container:"viewDiv",map:map});
layer.when(()=>view.goTo(layer.fullExtent));
let selected=null;
view.on('click',e=>{view.hitTest(e).then(r=>{const hit=r.results.find(x=>x.graphic&&x.graphic.layer===layer);if(!hit)return;selected=hit.graphic;document.getElementById('siteName').innerText='Selected OID: '+(selected.attributes.OBJECTID||'');});});
document.getElementById('directions').onclick=()=>{if(!selected)return;window.location.href='https://maps.apple.com/?daddr='+selected.geometry.latitude+','+selected.geometry.longitude;};
document.getElementById('survey').onclick=()=>{if(!selected)return;window.open('https://survey123.arcgis.com/share/753e0446354f4b28a94f0296db82afca?center='+selected.geometry.latitude+','+selected.geometry.longitude,'_blank');};
});
</script>
</head>
<body>
<div id="viewDiv"></div>
<div id="panel"><div id="siteName">Tap a parcel point</div><button id="directions">Directions</button><button id="survey">Open Survey</button></div>
</body>
</html>
