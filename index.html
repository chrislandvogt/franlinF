<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1720" />
  <title>Franklinford Field Collection</title>

  <link rel="stylesheet" href="https://js.arcgis.com/5.1/esri/themes/dark/main.css" />
  <script src="https://js.arcgis.com/5.1/"></script>

  <style>
    :root {
      --bg: #0b1720;
      --panel: rgba(11, 23, 32, 0.96);
      --panel-2: #132733;
      --text: #f7fbfc;
      --muted: #a9bdc8;
      --accent: #59e1d3;
      --accent-dark: #003d38;
      --warning: #ffc857;
      --done: #37c978;
      --line: rgba(255,255,255,.12);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; }
    html, body, #app, #viewDiv { width: 100%; height: 100%; margin: 0; }
    body { overflow: hidden; background: var(--bg); color: var(--text); font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    button, select { font: inherit; }

    #app { position: relative; }
    #viewDiv { position: absolute; inset: 0; }

    .topbar {
      position: absolute;
      z-index: 20;
      top: calc(10px + var(--safe-top));
      left: 10px;
      right: 10px;
      display: flex;
      gap: 8px;
      align-items: center;
      pointer-events: none;
    }

    .brand, .map-control, .status-pill {
      border: 1px solid var(--line);
      background: rgba(11,23,32,.9);
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .brand { padding: 10px 13px; border-radius: 15px; min-width: 0; pointer-events: auto; }
    .brand small { display: block; color: var(--accent); font-size: 10px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
    .brand strong { display: block; margin-top: 2px; font-size: 15px; white-space: nowrap; }
    .spacer { flex: 1; }

    .map-control {
      min-height: 44px;
      border-radius: 13px;
      color: var(--text);
      padding: 0 12px;
      pointer-events: auto;
      cursor: pointer;
    }

    select.map-control { max-width: 132px; }

    .locate-button {
      position: absolute;
      z-index: 20;
      right: 12px;
      bottom: calc(212px + var(--safe-bottom));
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 0;
      color: var(--accent-dark);
      background: var(--accent);
      box-shadow: 0 8px 24px rgba(0,0,0,.35);
      cursor: pointer;
      font-size: 22px;
    }

    .sheet {
      position: absolute;
      z-index: 30;
      left: 0;
      right: 0;
      bottom: 0;
      min-height: 194px;
      padding: 10px 14px calc(12px + var(--safe-bottom));
      border-top: 1px solid var(--line);
      border-radius: 22px 22px 0 0;
      background: var(--panel);
      box-shadow: 0 -16px 42px rgba(0,0,0,.38);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .handle { width: 42px; height: 4px; margin: 0 auto 10px; border-radius: 99px; background: #54707e; }
    .summary { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 12px; align-items: start; }
    .eyebrow { color: var(--accent); font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    h1 { margin: 2px 0 0; font-size: 22px; line-height: 1.15; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .metadata { margin-top: 5px; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .status-pill { padding: 7px 10px; border-radius: 999px; color: var(--muted); font-size: 12px; white-space: nowrap; }

    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 13px; }
    .action {
      min-height: 52px;
      border: 0;
      border-radius: 15px;
      padding: 0 14px;
      font-weight: 800;
      cursor: pointer;
    }
    .action:disabled { opacity: .45; cursor: not-allowed; }
    .directions { color: #042e2b; background: var(--accent); }
    .survey { color: #251900; background: var(--warning); }

    .progress-row { display: flex; align-items: center; gap: 10px; margin-top: 12px; color: var(--muted); font-size: 12px; }
    .progress-track { flex: 1; height: 6px; border-radius: 99px; overflow: hidden; background: rgba(255,255,255,.1); }
    .progress-bar { width: 0; height: 100%; background: var(--done); transition: width .25s ease; }

    .message {
      position: absolute;
      z-index: 50;
      left: 50%;
      top: calc(72px + var(--safe-top));
      transform: translateX(-50%);
      width: min(92vw, 520px);
      padding: 11px 14px;
      border-radius: 13px;
      color: #ffe9b0;
      background: rgba(67,43,0,.94);
      border: 1px solid rgba(255,200,87,.35);
      display: none;
    }

    .loading {
      position: absolute;
      z-index: 60;
      inset: 0;
      display: grid;
      place-items: center;
      background: var(--bg);
    }
    .loading-card { text-align: center; }
    .spinner { width: 34px; height: 34px; margin: 0 auto 12px; border: 3px solid rgba(255,255,255,.16); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .esri-ui-bottom-right { bottom: 215px !important; }
    .esri-attribution { max-width: calc(100vw - 16px); }

    @media (min-width: 760px) {
      .topbar { left: 18px; right: 18px; }
      .sheet { left: auto; right: 18px; bottom: 18px; width: 380px; border: 1px solid var(--line); border-radius: 22px; padding-bottom: 14px; }
      .locate-button { right: 414px; bottom: 20px; }
      .esri-ui-bottom-right { bottom: 20px !important; right: 430px !important; }
    }
  </style>
</head>
<body>
  <main id="app">
    <div id="viewDiv" aria-label="Franklinford inspection map"></div>

    <header class="topbar">
      <div class="brand">
        <small>Field collection</small>
        <strong>Franklinford parcel points</strong>
      </div>
      <div class="spacer"></div>
      <button id="nearestBtn" class="map-control" type="button">Nearest</button>
      <select id="basemapSelect" class="map-control" aria-label="Basemap">
        <option value="satellite">Imagery</option>
        <option value="hybrid">Hybrid</option>
        <option value="topo-vector">Topographic</option>
        <option value="streets-navigation-vector">Navigation</option>
      </select>
    </header>

    <button id="locateBtn" class="locate-button" type="button" title="Show my location" aria-label="Show my location">⌖</button>

    <section class="sheet" aria-live="polite">
      <div class="handle"></div>
      <div class="summary">
        <div>
          <div class="eyebrow">Selected inspection point</div>
          <h1 id="siteTitle">Select a point</h1>
          <div id="siteMeta" class="metadata">Tap a point on the map to begin.</div>
        </div>
        <div id="distancePill" class="status-pill">Ready</div>
      </div>
      <div class="actions">
        <button id="directionsBtn" class="action directions" type="button" disabled>Directions</button>
        <button id="surveyBtn" class="action survey" type="button" disabled>Open survey</button>
      </div>
      <div class="progress-row">
        <span id="progressText">Loading points…</span>
        <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
      </div>
    </section>

    <div id="message" class="message"></div>
    <div id="loading" class="loading"><div class="loading-card"><div class="spinner"></div><strong>Loading Franklinford points</strong></div></div>
  </main>

  <script type="module">
    const FEATURE_LAYER_URL = "https://services1.arcgis.com/vHnIGBHHqDR6y0CR/arcgis/rest/services/FF_parcelpoints/FeatureServer/0";
    const SURVEY_ITEM_ID = "753e0446354f4b28a94f0296db82afca";
    const SURVEY_FORM_URL = `https://survey123.arcgis.com/share/${SURVEY_ITEM_ID}`;

    const [Map, MapView, FeatureLayer, Graphic, GraphicsLayer, Point, geometryEngine, reactiveUtils] = await Promise.all([
      $arcgis.import("@arcgis/core/Map.js"),
      $arcgis.import("@arcgis/core/views/MapView.js"),
      $arcgis.import("@arcgis/core/layers/FeatureLayer.js"),
      $arcgis.import("@arcgis/core/Graphic.js"),
      $arcgis.import("@arcgis/core/layers/GraphicsLayer.js"),
      $arcgis.import("@arcgis/core/geometry/Point.js"),
      $arcgis.import("@arcgis/core/geometry/geometryEngine.js"),
      $arcgis.import("@arcgis/core/core/reactiveUtils.js")
    ]);

    const ui = {
      loading: document.getElementById("loading"),
      message: document.getElementById("message"),
      siteTitle: document.getElementById("siteTitle"),
      siteMeta: document.getElementById("siteMeta"),
      distancePill: document.getElementById("distancePill"),
      directionsBtn: document.getElementById("directionsBtn"),
      surveyBtn: document.getElementById("surveyBtn"),
      locateBtn: document.getElementById("locateBtn"),
      nearestBtn: document.getElementById("nearestBtn"),
      basemapSelect: document.getElementById("basemapSelect"),
      progressText: document.getElementById("progressText"),
      progressBar: document.getElementById("progressBar")
    };

    let selectedGraphic = null;
    let currentLocation = null;
    let allFeatures = [];
    let oidField = "OBJECTID";
    let displayField = null;
    let completionField = null;

    const map = new Map({ basemap: "satellite" });
    const selectionLayer = new GraphicsLayer({ title: "Selection" });

    const pointsLayer = new FeatureLayer({
      url: FEATURE_LAYER_URL,
      outFields: ["*"],
      popupEnabled: false,
      renderer: {
        type: "simple",
        symbol: {
          type: "simple-marker",
          style: "circle",
          color: "#ffc857",
          size: 11,
          outline: { color: "#0b1720", width: 2 }
        }
      }
    });

    map.addMany([pointsLayer, selectionLayer]);

    const view = new MapView({
      container: "viewDiv",
      map,
      constraints: { snapToZoom: false },
      highlightOptions: { color: "#59e1d3", haloOpacity: 0.9, fillOpacity: 0.2 },
      popup: { dockEnabled: false }
    });

    view.ui.components = ["attribution", "zoom"];

    function showMessage(text, timeout = 5000) {
      ui.message.textContent = text;
      ui.message.style.display = "block";
      window.clearTimeout(showMessage.timer);
      showMessage.timer = window.setTimeout(() => ui.message.style.display = "none", timeout);
    }

    function firstExistingField(candidates) {
      const fields = pointsLayer.fields.map(f => f.name.toLowerCase());
      for (const candidate of candidates) {
        const index = fields.indexOf(candidate.toLowerCase());
        if (index >= 0) return pointsLayer.fields[index].name;
      }
      return null;
    }

    function value(attributes, fieldName) {
      const v = fieldName ? attributes[fieldName] : null;
      return v === null || v === undefined || v === "" ? null : v;
    }

    function siteLabel(graphic) {
      const attrs = graphic.attributes || {};
      const preferred = firstExistingField(["site_id", "siteid", "point_id", "pointid", "name", "label", "parcel_id", "spi"]);
      return String(value(attrs, preferred) ?? value(attrs, displayField) ?? `Point ${value(attrs, oidField) ?? ""}`);
    }

    function parcelLabel(graphic) {
      const attrs = graphic.attributes || {};
      const field = firstExistingField(["spi", "parcel_spi", "parcel_id", "parcelid", "property_id", "ufi"]);
      return field && value(attrs, field) ? `${pointsLayer.getFieldDomain ? pointsLayer.fields.find(f => f.name === field)?.alias || field : field}: ${value(attrs, field)}` : "Franklinford inspection location";
    }

    function isComplete(graphic) {
      if (!completionField) return false;
      const raw = value(graphic.attributes || {}, completionField);
      if (raw === null) return false;
      return ["yes", "true", "complete", "completed", "done", "visited", "1"].includes(String(raw).toLowerCase());
    }

    function toWgs84(graphic) {
      const g = graphic.geometry;
      if (!g) return null;
      if (g.spatialReference?.isWGS84) return g;
      return g.clone ? g.clone() : g;
    }

    function coordinates(graphic) {
      const point = toWgs84(graphic);
      if (!point) return null;
      if (Number.isFinite(point.latitude) && Number.isFinite(point.longitude)) {
        return { lat: point.latitude, lon: point.longitude };
      }
      return null;
    }

    function distanceKm(a, b) {
      if (!a || !b) return null;
      const toRad = d => d * Math.PI / 180;
      const R = 6371;
      const dLat = toRad(b.lat - a.lat);
      const dLon = toRad(b.lon - a.lon);
      const q = Math.sin(dLat/2)**2 + Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dLon/2)**2;
      return 2 * R * Math.asin(Math.sqrt(q));
    }

    function updateProgress() {
      const total = allFeatures.length;
      const done = completionField ? allFeatures.filter(isComplete).length : 0;
      ui.progressText.textContent = completionField ? `${done} completed · ${total - done} remaining` : `${total} inspection points`;
      ui.progressBar.style.width = completionField && total ? `${(done / total) * 100}%` : "0%";
    }

    async function selectSite(graphic, zoom = false) {
      selectedGraphic = graphic;
      const coords = coordinates(graphic);
      const km = currentLocation && coords ? distanceKm(currentLocation, coords) : null;

      selectionLayer.removeAll();
      selectionLayer.add(new Graphic({
        geometry: graphic.geometry,
        symbol: {
          type: "simple-marker",
          style: "circle",
          color: [0,0,0,0],
          size: 24,
          outline: { color: "#59e1d3", width: 4 }
        }
      }));

      ui.siteTitle.textContent = siteLabel(graphic);
      ui.siteMeta.textContent = parcelLabel(graphic);
      ui.distancePill.textContent = km === null ? (isComplete(graphic) ? "Completed" : "Selected") : `${km < 1 ? Math.round(km*1000) + " m" : km.toFixed(1) + " km"} away`;
      ui.directionsBtn.disabled = !coords;
      ui.surveyBtn.disabled = !coords;

      if (zoom) await view.goTo({ target: graphic.geometry, zoom: Math.max(view.zoom || 0, 17) }, { duration: 450 }).catch(() => {});
    }

    function getDeviceLocation({ zoom = true } = {}) {
      if (!navigator.geolocation) {
        showMessage("Location services are not available in this browser.");
        return;
      }
      navigator.geolocation.getCurrentPosition(async position => {
        currentLocation = { lat: position.coords.latitude, lon: position.coords.longitude };
        const p = new Point({ longitude: currentLocation.lon, latitude: currentLocation.lat });
        selectionLayer.graphics.filter(g => g.attributes?.deviceLocation).forEach(g => selectionLayer.remove(g));
        selectionLayer.add(new Graphic({
          geometry: p,
          attributes: { deviceLocation: true },
          symbol: { type: "simple-marker", color: "#2b8cff", size: 13, outline: { color: "white", width: 3 } }
        }));
        if (zoom) await view.goTo({ target: p, zoom: Math.max(view.zoom || 0, 15) }).catch(() => {});
        if (selectedGraphic) selectSite(selectedGraphic, false);
      }, error => showMessage(`Unable to access your location: ${error.message}`), {
        enableHighAccuracy: true,
        timeout: 12000,
        maximumAge: 15000
      });
    }

    function openDirections() {
      const c = selectedGraphic && coordinates(selectedGraphic);
      if (!c) return;
      const destination = `${c.lat},${c.lon}`;
      const isApple = /iPad|iPhone|iPod|Macintosh/.test(navigator.userAgent);
      const url = isApple
        ? `https://maps.apple.com/?daddr=${encodeURIComponent(destination)}&dirflg=d`
        : `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(destination)}`;
      window.location.assign(url);
    }

    function openSurvey() {
      if (!selectedGraphic) return;
      const attrs = selectedGraphic.attributes || {};
      const c = coordinates(selectedGraphic);
      const params = new URLSearchParams();
      params.set("open", "web");
      params.set("center", `${c.lat},${c.lon}`);

      const mappings = [
        ["site_id", firstExistingField(["site_id", "siteid", "point_id", "pointid"])],
        ["parcel_spi", firstExistingField(["parcel_spi", "spi", "parcel_id", "parcelid"])],
        ["source_objectid", oidField]
      ];

      for (const [surveyQuestion, layerField] of mappings) {
        const v = value(attrs, layerField);
        if (v !== null) params.set(`field:${surveyQuestion}`, String(v));
      }

      const surveyUrl = `${SURVEY_FORM_URL}?${params.toString()}`;
      window.location.assign(surveyUrl);
    }

    async function selectNearest() {
      if (!currentLocation) {
        showMessage("Getting your current location. Tap Nearest again once the blue location marker appears.");
        getDeviceLocation({ zoom: false });
        return;
      }
      const candidates = allFeatures.filter(f => !isComplete(f));
      const pool = candidates.length ? candidates : allFeatures;
      let nearest = null;
      let nearestDistance = Infinity;
      for (const feature of pool) {
        const d = distanceKm(currentLocation, coordinates(feature));
        if (d !== null && d < nearestDistance) { nearest = feature; nearestDistance = d; }
      }
      if (nearest) selectSite(nearest, true);
    }

    ui.basemapSelect.addEventListener("change", e => map.basemap = e.target.value);
    ui.locateBtn.addEventListener("click", () => getDeviceLocation({ zoom: true }));
    ui.nearestBtn.addEventListener("click", selectNearest);
    ui.directionsBtn.addEventListener("click", openDirections);
    ui.surveyBtn.addEventListener("click", openSurvey);

    view.on("click", async event => {
      const response = await view.hitTest(event, { include: pointsLayer });
      const result = response.results.find(r => r.graphic?.layer === pointsLayer);
      if (result) selectSite(result.graphic, false);
    });

    try {
      await pointsLayer.load();
      oidField = pointsLayer.objectIdField || "OBJECTID";
      displayField = pointsLayer.displayField || null;
      completionField = firstExistingField(["status", "inspection_status", "visit_status", "completed", "complete", "visited"]);

      await view.when();
      const query = pointsLayer.createQuery();
      query.where = "1=1";
      query.outFields = ["*"];
      query.returnGeometry = true;
      const result = await pointsLayer.queryFeatures(query);
      allFeatures = result.features;

      if (!allFeatures.length) throw new Error("The feature layer contains no inspection points.");

      updateProgress();
      await view.goTo(pointsLayer.fullExtent.expand(1.35), { duration: 0 }).catch(() => {});
      await selectSite(allFeatures[0], false);
      ui.loading.style.display = "none";
      getDeviceLocation({ zoom: false });
    } catch (error) {
      console.error(error);
      ui.loading.style.display = "none";
      showMessage(`The inspection layer could not be loaded. ${error.message || "Check that layer 0 is public."}`, 15000);
      ui.progressText.textContent = "Layer unavailable";
    }
  </script>
</body>
</html>
